<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartUploader</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="/static/image-uploader/css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/image-uploader/css/style.css">
</head>

<body>
    <section class="upload__intro">
        <h2 class="upload__title">Upload Photos</h2>
        <p class="upload__description">Upload selfies, memes, or any fun pictures here.</p>
    </section>
    <nav class="upload__tabs">
        <button class="upload__tab" id="upload-tab-btn">Upload</button>
        <button class="upload__tab upload__tab--active" id="images-tab-btn">Images</button>
    </nav>
    <section id="file-list-wrapper">

    </section>
    <nav aria-label="navigation" id="pagination-wrapper">
        <ul class="pagination justify-content-center">
            <li class="page-item">
                <a class="page-link" id="prev-page-btn" href="#"
                   tabindex="-1">Previous</a>
            </li>
            <li class="page-item active"><a class="page-link"
                                            id="current-page"
                                            href="#"></a></li>
            <li class="page-item">
                <a class="page-link" id="next-page-btn" href="#">Next</a>
            </li>
        </ul>
    </nav>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="/static/image-uploader/js/images.js"></script>

</html>
